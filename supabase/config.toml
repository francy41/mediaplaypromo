# MediaPlayPromo — Supabase config
# Project: osearkjjulupmznvkzaw
# Linked to: github.com/francy41/mediaplaypromo

project_id = "osearkjjulupmznvkzaw"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://mediaplaypromo.com"
additional_redirect_urls = [
  "https://mediaplaypromo.com/**",
  "https://www.mediaplaypromo.com/**",
  "http://localhost:3001/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"
